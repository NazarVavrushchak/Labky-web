<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List (LocalStorage)</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <h1>TO-DO list</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Введіть нове завдання">
            <button id="addBtn">Додати</button>
        </div>


        <button id="sortBtn" class="sort-btn">Сортувати за датою додавання (нові спочатку)</button>

        <ul id="taskList">

        </ul>
    </div>


    <script src="script.js"></script>
</body>

</html>
